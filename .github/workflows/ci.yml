name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is arm64; ubuntu-latest is amd64. Both release targets in
        # TECHNICAL_DESIGN.md section 33 are covered.
        os: [ubuntu-latest, macos-15]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Synchronise locked dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Check generated JSON Schemas for drift
        run: uv run python scripts/generate_contracts.py --check

      - name: Test with coverage
        # tests/integration needs a real Docker daemon (BE-16); macos-15 runners
        # do not have one. That suite runs, uncapped by the coverage gate below,
        # in the dedicated runner-integration job instead.
        run: uv run pytest tests/unit tests/contract

  runner-integration:
    name: Runner adversarial tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Synchronise locked dependencies
        run: uv sync --all-groups

      - name: Pull the test image
        run: docker pull alpine:3.19

      - name: Run the isolated-runner adversarial suite
        run: uv run pytest tests/integration --no-cov -v

  contracts:
    name: Contract types (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/types/package-lock.json

      - name: Install the pinned contract toolchain
        run: npm ci
        working-directory: contracts/types

      - name: Check generated JSON Schemas for drift
        run: uv run python scripts/generate_contracts.py --check

      - name: Check generated TypeScript for drift
        run: npm run check
        working-directory: contracts/types

      - name: Compile the generated types
        run: npm run compile
        working-directory: contracts/types

      - name: Validate the frozen fixtures with Ajv
        run: npm run validate:fixtures
        working-directory: contracts/types

  fixtures:
    name: Fixture integration (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest-addressed, matching fixtures/benchmark-corpus.yaml. A floating
        # tag would reattribute fixture behaviour to a different server build.
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: fixture
      PGPASSWORD: fixture
      # dataset-small.sql, not dataset.sql. The 400,000-row benchmark dataset and
      # the timing runs stay out of ordinary CI on purpose.
      FIXTURE_DATASET: dataset-small.sql
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create one database per fixture
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE demo_broken;'
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE demo_clean;'

      - name: Apply each Alembic history and load the dataset
        run: |
          set -euo pipefail
          for name in broken clean; do
            pushd "fixtures/demo-$name"
            uv sync --all-groups --frozen
            DATABASE_URL="postgresql+psycopg://fixture:fixture@127.0.0.1:5432/demo_$name" \
              uv run --frozen alembic upgrade head
            head=$(psql -d "demo_$name" -tAc 'SELECT version_num FROM alembic_version;')
            test "$head" = "6a912ef4c1b8" || { echo "unexpected head: $head"; exit 1; }
            psql -d "demo_$name" -v ON_ERROR_STOP=1 -f "$FIXTURE_DATASET"
            popd
          done

      - name: Run both fixture test suites
        run: |
          set -euo pipefail
          for name in broken clean; do
            pushd "fixtures/demo-$name"
            DATABASE_URL="postgresql+psycopg://fixture:fixture@127.0.0.1:5432/demo_$name" \
              uv run --frozen pytest
            popd
          done

      - name: Assert the expected catalog differences
        run: |
          set -euo pipefail
          expect() {
            actual=$(psql -d "$1" -tAc "$3" | tr -d '[:space:]')
            if [ "$actual" != "$2" ]; then
              echo "FAIL $1: expected $2, got $actual for: $3"
              exit 1
            fi
            echo "ok $1 = $2 :: $3"
          }
          fk="SELECT count(*) FROM pg_constraint WHERE conname='fk_orders_tenant_id';"
          ix1="SELECT count(*) FROM pg_indexes WHERE indexname='ix_orders_user_id';"
          ix2="SELECT count(*) FROM pg_indexes WHERE indexname='ix_orders_tenant_status_created';"
          items="SELECT count(*) FROM pg_indexes WHERE indexname='ix_order_items_order_id';"
          expect demo_broken 0 "$fk"
          expect demo_broken 0 "$ix1"
          expect demo_broken 0 "$ix2"
          expect demo_clean 1 "$fk"
          expect demo_clean 1 "$ix1"
          expect demo_clean 1 "$ix2"
          expect demo_broken 1 "$items"
          expect demo_clean 1 "$items"

      - name: Assert observed N+1 in broken and a fixed count in clean
        run: |
          set -euo pipefail
          for name in broken clean; do
            pushd "fixtures/demo-$name"
            DATABASE_URL="postgresql+psycopg://fixture:fixture@127.0.0.1:5432/demo_$name" \
              uv run --frozen python ../../scripts/fixture_measurements.py nplus1 \
                --fixture . --tenant-id 1 --status paid > "../../nplus1-$name.json"
            popd
          done
          uv run python scripts/fixture_measurements.py compare-nplus1 \
            --broken nplus1-broken.json --clean nplus1-clean.json --clean-expected 2

      - name: Clean up
        if: always()
        run: |
          rm -f nplus1-broken.json nplus1-clean.json
          rm -rf fixtures/demo-broken/.venv fixtures/demo-clean/.venv
          psql -d postgres -c 'DROP DATABASE IF EXISTS demo_broken;' || true
          psql -d postgres -c 'DROP DATABASE IF EXISTS demo_clean;' || true

  package:
    name: Package build and wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Install the built wheel in an isolated environment
        run: |
          uv venv /tmp/pgproof-wheel-check
          VIRTUAL_ENV=/tmp/pgproof-wheel-check uv pip install --no-cache dist/*.whl

      - name: Verify the installed entry point
        run: |
          /tmp/pgproof-wheel-check/bin/pgproof --version
          /tmp/pgproof-wheel-check/bin/pgproof --help

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
