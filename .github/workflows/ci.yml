name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is arm64; ubuntu-latest is amd64. Both release targets in
        # TECHNICAL_DESIGN.md section 33 are covered.
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Synchronise locked dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test with coverage
        run: uv run pytest

  package:
    name: Package build and wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Install the built wheel in an isolated environment
        run: |
          uv venv /tmp/pgproof-wheel-check
          VIRTUAL_ENV=/tmp/pgproof-wheel-check uv pip install --no-cache dist/*.whl

      - name: Verify the installed entry point
        run: |
          /tmp/pgproof-wheel-check/bin/pgproof --version
          /tmp/pgproof-wheel-check/bin/pgproof --help

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
