[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "pgproof"
version = "0.1.0"
description = "Local-first PostgreSQL design reviewer and experimental performance lab for SQLAlchemy and Alembic projects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "pgproof contributors" }]
keywords = ["postgresql", "sqlalchemy", "alembic", "database-design", "code-analysis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
# Bounded below v3: the domain models target the Pydantic v2 API, and the
# generated JSON Schemas are produced by its schema generator.
dependencies = [
  "click>=8.1.7",
  "pydantic>=2.9,<3",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "anyio<4.15",
  # `@override` on `BaseHTTPMiddleware.dispatch`, backported below Python 3.12.
  "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/suryanshqt/pgproof"
Repository = "https://github.com/suryanshqt/pgproof"
Issues = "https://github.com/suryanshqt/pgproof/issues"

[project.scripts]
pgproof = "pgproof.cli.app:main"

[dependency-groups]
dev = [
  # Mirrors the exact [build-system] requirement so uv.lock records the
  # build backend version; uv lockfile v1 does not lock build backends itself.
  "hatchling==1.32.0",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
  "ruff>=0.9",
  # Starlette's TestClient (used by FastAPI) requires httpx2; test-only.
  "httpx2>=2.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pgproof"]

# The generated schemas are canonically at contracts/schemas per ARCHITECTURE
# section 5. Copying them under the package makes an installed pgproof able to
# resolve its own contracts through importlib.resources, per section 15. Frozen
# fixtures and the TypeScript toolchain are deliberately not copied.
[tool.hatch.build.targets.wheel.force-include]
"contracts/schemas" = "pgproof/contracts/schemas"

[tool.hatch.build.targets.sdist]
# Leading slashes anchor each pattern at the repository root. Unanchored "tests"
# and "README.md" also matched fixtures/demo-*/tests and fixtures/README.md,
# shipping a fixture with its tests but without its models, migrations, or oracle.
include = [
  "/.github/workflows",
  "/scripts",
  "/src/pgproof",
  "/tests",
  "/contracts",
  "/docs",
  "/fixtures",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Pinned so a ruff upgrade cannot start reformatting code blocks inside the
# accepted design documents under docs/ and ideation/.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
# fixtures/ holds deliberately defective sample repositories analysed as data.
# Linting or reformatting them would erase the defects they exist to carry.
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = [
  "A",    # builtin shadowing
  "ANN",  # annotations
  "ARG",  # unused arguments
  "B",    # bugbear
  "C4",   # comprehensions
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import order
  "N",    # naming
  "PT",   # pytest style
  "PTH",  # prefer pathlib
  "RET",  # return simplification
  "RUF",  # ruff-specific
  "SIM",  # simplification
  "TID",  # tidy imports
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
]

# scripts/fixture_measurements.py drives the fixture stack, which is deliberately
# not a pgproof dependency. Its drivers are imported lazily and only resolve
# inside a fixture environment.
[[tool.mypy.overrides]]
module = ["app.*", "psycopg", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov",
  "--cov-report=term-missing",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["pgproof"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
